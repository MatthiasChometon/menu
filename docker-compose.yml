# Infrastructure the back needs in development.
# Postgres is published on 5433 so it never collides with another local
# instance (verdure's compose already holds 5432).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu
      POSTGRES_DB: menu_semaine
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U menu -d menu_semaine']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
