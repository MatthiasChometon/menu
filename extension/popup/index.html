<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Menu — courses</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        width: 20rem;
        margin: 0;
        padding: 1rem;
      }
      h1 {
        font-size: 1rem;
        margin: 0 0 0.75rem;
      }
      label {
        display: block;
        font-size: 0.8rem;
        margin-top: 0.75rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.4rem;
        margin-top: 0.25rem;
        font: inherit;
      }
      button {
        margin-top: 1rem;
        width: 100%;
        padding: 0.5rem;
        font: inherit;
        cursor: pointer;
      }
      p {
        font-size: 0.8rem;
        margin: 0.75rem 0 0;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>Courses Carrefour</h1>
    <label>
      Adresse de l'API
      <input id="endpoint" type="url" placeholder="https://menuuu.duckdns.org/graphql" />
    </label>
    <label>
      Jeton d'appairage
      <input id="token" type="password" autocomplete="off" />
    </label>
    <button id="save" type="button">Enregistrer</button>
    <p id="status" role="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
