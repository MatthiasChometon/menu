<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu — courses</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        width: 18rem;
        margin: 0;
        padding: 1rem;
      }
      h1 {
        font-size: 1rem;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.85rem;
        line-height: 1.45;
        margin: 0 0 0.9rem;
      }
      /* A quiet dot that greens once this browser is wired up. */
      p::before {
        content: '';
        display: inline-block;
        width: 0.55rem;
        height: 0.55rem;
        margin-right: 0.4rem;
        border-radius: 50%;
        background: #9ca3af;
        vertical-align: baseline;
      }
      p[data-paired='true']::before {
        background: #65a30d;
      }
      a {
        display: block;
        text-align: center;
        padding: 0.55rem;
        border-radius: 0.5rem;
        background: #4d7c0f;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Courses Carrefour</h1>
    <p id="status" role="status"></p>
    <a id="open" href="https://menu.mtxlab.xyz/courses-auto">Ouvrir Le Menu</a>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
