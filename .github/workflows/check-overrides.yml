name: Check overrides

# A pnpm override is a debt: it exists because a parent still asks for a version
# with a published advisory. This fails when one is no longer needed, so it gets
# removed instead of living on. The registry changes without any commit, hence the
# weekly run on top of pull requests that touch an override or a dependency.
on:
  pull_request:
    paths:
      - "back/pnpm-workspace.yaml"
      - "front/pnpm-workspace.yaml"
      - "back/package.json"
      - "front/package.json"
      - "extension/package.json"
      - "back/pnpm-lock.yaml"
      - "front/pnpm-lock.yaml"
      - "extension/pnpm-lock.yaml"
      - "ops/check-overrides.test.mjs"
      - "ops/check-overrides.mjs"
      - ".github/workflows/check-overrides.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-overrides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overrides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the check (needed, not needed, error)
        run: node --test ops/check-overrides.test.mjs

      - name: Overrides still needed
        run: node ops/check-overrides.mjs back front
