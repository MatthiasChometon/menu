name: CI e2e

# The front's Playwright suites: the behaviour tests (`*.e2e.test.ts`) and the visual
# regression tests (`*visual.test.ts`), run against the generated site served by
# `nuxt preview`. They are slower than the unit gate (ci-front.yml) and need Chromium,
# so they run on their own workflow.
#
# Baselines: the committed ones are rendered on Windows (`*-win32.png`) and are never
# updated during the refactor campaign. A Linux runner has none, so the first runs use
# `--update-snapshots=missing`: a screenshot without a baseline is written instead of
# failing, one that has a baseline is still compared. The written `*-linux.png` files
# are uploaded as the `linux-baselines` artifact, to be reviewed by eye and committed by
# a person. Until they are, the visual part of this run only proves that every page
# renders; the behaviour tests are real assertions from the first run.
#
# Pages that show a date (the batch page) must not depend on the clock to be stable on
# a fresh baseline: that is lot M8's clock freeze.
on:
  pull_request:
    paths:
      - "front/**"
      - "back/infrastructure/graphql/schema.gql"
      - ".github/workflows/ci-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate the site
        run: pnpm generate

      - name: Playwright suites
        run: pnpm exec playwright test --update-snapshots=missing

      - name: Upload the Linux baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: front/**/*-linux.png
          if-no-files-found: ignore

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/test-results
          if-no-files-found: ignore
