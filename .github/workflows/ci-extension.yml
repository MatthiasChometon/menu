name: CI extension

# Runs on every pull request that touches the browser extension.
on:
  pull_request:
    paths:
      - "extension/**"
      - "front/**"
      - ".github/workflows/ci-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            extension/pnpm-lock.yaml
            front/pnpm-lock.yaml

      # The postinstall hook runs `wxt prepare`, which generates the typings and
      # the ESLint auto-imports the lint step needs.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The extension imports the bridge from front/domain/order and the bundler
      # resolves it through the front's generated tsconfig: installing the front
      # runs its postinstall (`nuxt prepare`), which generates it.
      - name: Install the front the extension imports from
        working-directory: front
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
