name: Deploy front (Netlify)

# Push to main -> lint + tests, then the static front is built and deployed to
# Netlify. A failing check stops the job before Deploy, so a broken commit never
# reaches prod. Runs in parallel with the back CI (separate runner). Netlify is not
# behind the o2switch firewall, so this needs only the NETLIFY_AUTH_TOKEN secret.
# Types come from the versioned back schema.gql, so the build needs no running API.
on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - 'back/infrastructure/graphql/schema.gql'
      - '.github/workflows/deploy-front.yml'
  workflow_dispatch:

concurrency:
  group: deploy-front
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The action reads packageManager from this file (it ignores
          # working-directory); the repo has no root package.json.
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gate the deploy on the checks: a failing step stops the job before Deploy.
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

      - name: Generate (static)
        run: pnpm generate
        env:
          GQL_HOST: https://api.menu.mtxlab.xyz/graphql
          GQL_CLIENT_HOST: https://api.menu.mtxlab.xyz/graphql
          NUXT_PUBLIC_API_BASE: https://api.menu.mtxlab.xyz
          NUXT_PUBLIC_I18N_BASE_URL: https://menu.mtxlab.xyz
          NUXT_PUBLIC_IMAGES_BASE: https://images.menu.mtxlab.xyz

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@26 deploy --prod --no-build --dir=.output/public --site ccbc7586-c0fe-4630-962b-e67f5ac38039
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
