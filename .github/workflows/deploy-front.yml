name: Deploy front (Netlify)

# Push to main -> the static front is rebuilt and deployed to Netlify. Netlify is
# not behind the o2switch firewall, so this needs only a Netlify token (added as a
# repo secret) — no SSH, no IP to authorise. The types come from the versioned
# back/infrastructure/graphql/schema.gql, so the build needs no running API.
on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - 'back/infrastructure/graphql/schema.gql'
      - '.github/workflows/deploy-front.yml'
  workflow_dispatch:

concurrency:
  group: deploy-front
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      # Skip cleanly (green run, not a red failure) until the token is added, so a
      # push before setup does not spam a failure. Add NETLIFY_AUTH_TOKEN in
      # Settings -> Secrets and variables -> Actions.
      - name: Check Netlify token
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then
            echo "NETLIFY_AUTH_TOKEN not set — add it in repo settings; skipping deploy."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: pnpm/action-setup@v4
        if: env.SKIP != '1'
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install
        if: env.SKIP != '1'
        run: pnpm install --frozen-lockfile

      - name: Generate (static)
        if: env.SKIP != '1'
        run: pnpm generate
        env:
          GQL_HOST: https://api.menu.mtxlab.xyz/graphql
          GQL_CLIENT_HOST: https://api.menu.mtxlab.xyz/graphql
          NUXT_PUBLIC_API_BASE: https://api.menu.mtxlab.xyz
          NUXT_PUBLIC_I18N_BASE_URL: https://menu.mtxlab.xyz
          NUXT_PUBLIC_IMAGES_BASE: https://images.menu.mtxlab.xyz

      - name: Deploy to Netlify
        if: env.SKIP != '1'
        run: npx --yes netlify-cli@17 deploy --prod --no-build --dir=.output/public --site ccbc7586-c0fe-4630-962b-e67f5ac38039
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
