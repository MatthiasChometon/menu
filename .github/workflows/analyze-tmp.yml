name: Analyze tmp
on:
  pull_request:
    paths: ['.github/workflows/analyze-tmp.yml']
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front
    env:
      NITRO_PRESET: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nuxt build --analyze || true
      - run: |
          find .nuxt/analyze .output -name "*.html" -o -name "*.json" 2>/dev/null | grep -i -E "stats|analy" | head
      - uses: actions/upload-artifact@v4
        with:
          name: analyze
          path: |
            front/.nuxt/analyze
            front/.output/public/_nuxt/*.js
          retention-days: 3
