name: Perf front

# Screen timings, INP and Lighthouse budgets of the front, on the generated site as it is
# deployed. Blocking: a budget that is missed is a bug, never a threshold to loosen.
# Timings run on the CI runner only; at most one automatic retry of a failed test.
on:
  pull_request:
    paths:
      - "front/**"
      - ".github/workflows/perf-front.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timings:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: front
    env:
      PORT: "3777"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Restore the localised photographs
        uses: actions/cache@v4
        with:
          path: front/public/img
          key: localised-images-${{ github.run_id }}
          restore-keys: localised-images-
      - run: pnpm generate
      # The CPU slowdown is 4 x benchmarkIndex / reference (front/perf-calibration.cjs). A warm-up whose
      # indexes stray more than 15 % is not a measure of the runner: it is run once more, then the job fails.
      - name: Calibrate the CPU slowdown to this runner
        run: pnpm calibrate || pnpm calibrate
      - name: Timings, INP and layout shift (calibrated CPU slowdown, median of 10)
        run: pnpm test:perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-timings
          path: front/test-results
          retention-days: 14
          if-no-files-found: ignore

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Hot pure functions against the stored baseline
        run: pnpm bench

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: front
    env:
      PORT: "3777"
      NITRO_PRESET: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Restore the localised photographs
        uses: actions/cache@v4
        with:
          path: front/public/img
          key: localised-images-${{ github.run_id }}
          restore-keys: localised-images-
      # The image host's manifest is read while generating; an empty one ships pages with no photographs
      # and no preload, which is not the site being measured. One new attempt, then the job fails.
      - run: pnpm generate && pnpm check:generated || (pnpm generate && pnpm check:generated)
      - name: Calibrate the CPU slowdown to this runner (one retry if the runner speed is unsteady)
        run: pnpm calibrate || pnpm calibrate
      - name: Lighthouse, median of 5 runs per page
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs
      - name: Runner speed and medians per URL (grep LH-SUMMARY)
        if: always()
        run: node infrastructure/performance/summarize-lighthouse.cjs lighthouse-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: front/lighthouse-reports
          retention-days: 30
