name: CI front

# Runs on every pull request that touches the front, or the GraphQL schema its types are
# generated from. The deploy workflow (deploy-front.yml) only runs on main and gates itself
# on lint + tests; this one is the full gate before the merge.
#
# Not run here, on purpose: the visual regression and Playwright behaviour suites,
# which need Chromium and a preview server. They have their own workflow (ci-e2e.yml).
on:
  pull_request:
    paths:
      - "front/**"
      - "back/infrastructure/graphql/schema.gql"
      - ".github/workflows/ci-front.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The action reads packageManager from this file (it ignores
          # working-directory); the repo has no root package.json.
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      # The postinstall hook runs `nuxt prepare`, which generates the GraphQL types
      # from the versioned back/infrastructure/graphql/schema.gql: no API needed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        # Blocking on purpose, low included: a known advisory is fixed or recorded
        # in docs/plans/refactor-socle.md, never waved through.
        run: pnpm audit --prod --audit-level=low

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
