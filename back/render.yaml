# Render blueprint for the API. Committed so the deployment is reviewable and
# reproducible rather than a sequence of clicks nobody remembers.
#
#   Render dashboard → New → Blueprint → point it at this repository.
#
# The database is NOT declared here: Render's free Postgres expires after 30
# days. Neon's free tier does not, so DATABASE_URL is set by hand to a Neon
# connection string (sslmode=require).
services:
  - type: web
    name: menu-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: back
    dockerCommand: sh ./docker-entrypoint.sh node dist/main
    healthCheckPath: /graphql
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3779

      # --- set by hand in the dashboard, never in the repository ------------
      # Neon connection string, sslmode=require.
      - key: DATABASE_URL
        sync: false
      # node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- who may in ------------------------------------------------------
      # The two Google addresses allowed to hold an account, comma separated.
      # Empty would open the app to anyone who finds the URL.
      - key: ALLOWED_EMAILS
        sync: false

      # --- addresses --------------------------------------------------------
      # Must be https and must match the Google console's authorised redirect
      # URI exactly, or sign-in fails with redirect_uri_mismatch.
      - key: BACK_URL
        value: https://menu-api.onrender.com
      - key: FRONT_URL
        value: https://menu-semaine-887.netlify.app
      - key: ALLOWED_ORIGINS
        value: https://menu-semaine-887.netlify.app

      # Off in production: introspection hands the whole schema to anyone who
      # asks. Turn it on only for the window a front build needs it, or point
      # the front's codegen at a versioned schema.gql instead.
      - key: GRAPHQL_INTROSPECTION
        value: 'false'
