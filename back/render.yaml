# Render blueprint for the API. Committed so the deployment is reviewable and
# reproducible rather than a sequence of clicks nobody remembers.
#
#   Render dashboard → New → Blueprint → point it at this repository.
#
# The database is NOT declared here: Render's free Postgres expires after 30
# days. Neon's free tier does not, so DATABASE_URL is set by hand to a Neon
# connection string (sslmode=require).
services:
  - type: web
    name: menu-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: back
    dockerCommand: sh ./docker-entrypoint.sh node dist/main
    # A GET on /graphql answers 400, which the platform reads as a dead
    # service and never routes traffic to.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3779

      # The free instance is capped at 512 MB, but Node does not see that cap:
      # left alone it reads the host's memory and sizes its heap at about
      # 2.2 GB, so nothing makes it collect before it runs past the limit. That
      # is what OOM-killed this service in a loop, every request hanging until
      # it timed out. Measured for comparison: the same image under a visible
      # 512 MB cgroup limit settles at 74 MB.
      - key: NODE_OPTIONS
        value: --max-old-space-size=320

      # --- set by hand in the dashboard, never in the repository ------------
      # Neon connection string, sslmode=require.
      - key: DATABASE_URL
        sync: false
      # node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- who may in ------------------------------------------------------
      # The two Google addresses allowed to hold an account, comma separated.
      # Empty would open the app to anyone who finds the URL.
      - key: ALLOWED_EMAILS
        sync: false

      # --- addresses --------------------------------------------------------
      # BACK_URL is the address Render gives THIS service once created — the
      # name below is only a request, and Render appends a suffix if it is
      # taken. Read the real URL off the dashboard and paste it here; a guessed
      # onrender.com hostname belongs to whoever claimed it first.
      # It must also match the Google console's authorised redirect URI exactly,
      # or sign-in fails with redirect_uri_mismatch.
      - key: BACK_URL
        sync: false
      - key: FRONT_URL
        value: https://menu-semaine-887.netlify.app
      - key: ALLOWED_ORIGINS
        value: https://menu-semaine-887.netlify.app

      # Off in production: introspection hands the whole schema to anyone who
      # asks. Turn it on only for the window a front build needs it, or point
      # the front's codegen at a versioned schema.gql instead.
      - key: GRAPHQL_INTROSPECTION
        value: 'false'
