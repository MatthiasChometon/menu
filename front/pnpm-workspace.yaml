allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  esbuild: true
  unrs-resolver: true
  vue-demi: false

# Transitive packages with a published advisory that their parents have not
# picked up yet. Each line goes when `pnpm audit --prod` stays clean without it.
# Build-time tooling (GraphQL codegen, Nuxt devtools) is part of the prod graph
# pnpm audits, which is why it is listed here too.
overrides:
  '@graphql-tools/utils': '>=12.0.2'
  '@simple-git/argv-parser': '>=2.0.1'
  simple-git: '>=4.0.1'
  zod: '>=4.6.6'
  lodash: '>=4.17.24'
  'immutable@<3.8.4': '3.8.4'
  'readdir-glob>minimatch': '>=11.0.1'
  'graphql-config>minimatch': '>=11.0.1'
  '@eslint/config-array>minimatch': '>=11.0.1'
  'eslint>minimatch': '>=11.0.1'
