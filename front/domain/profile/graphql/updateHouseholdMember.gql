mutation updateHouseholdMember($input: UpdateHouseholdMemberInput!) {
  updateHouseholdMember(input: $input) {
    id
    name
    sex
    age
    heightCm
    weightKg
    dailyActivity
    trainingDaysPerWeek
    trainingType
    starchQuality
    appetite
    goal
    targets {
      kcal
      protein
      fat
      carbs
      fiber
    }
  }
}
