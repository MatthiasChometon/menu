# menu — full-stack orchestration (prod).
#
# Self-contained (do NOT merge with docker-compose.yml): the source trees are
# baked into the images instead of bind-mounted, the back runs the compiled
# server and the front serves its prerendered output.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# The front builds once on first boot (it needs the live back for codegen); its
# node_modules lives in a volume, so remove it to force a clean rebuild:
#   docker compose -f docker-compose.prod.yml down -v

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Single-user local prod: trim Postgres' memory footprint. The defaults
    # assume a busy multi-tenant server; here a handful of connections is plenty.
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=8MB
    mem_limit: 512m
    environment:
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu
      POSTGRES_DB: menu
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U menu -d menu']
      interval: 10s
      timeout: 5s
      retries: 5

  back:
    build:
      context: ./back
      target: prod
    image: menu-back:prod
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    # Secrets (JWT_SECRET, the Google credentials) stay in the back's own .env,
    # which is gitignored and never baked into the image. Everything else is
    # overridden below — `environment` wins.
    env_file:
      - path: ./back/.env
        required: false
    environment:
      PORT: 3779
      DATABASE_URL: postgres://menu:menu@postgres:5432/menu
      # Both are browser-facing addresses: one builds the OAuth redirect URI,
      # the other is where the user lands once signed in. Set PUBLIC_HOST to
      # your LAN IP to use the app from a phone; defaults to localhost.
      BACK_URL: http://${PUBLIC_HOST:-localhost}:3779
      FRONT_URL: http://${PUBLIC_HOST:-localhost}:3777
      # Who may hold an account. Empty means anyone, which is only safe on a
      # machine nobody else can reach; a deployment must set it.
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      # Browsers allowed to send credentialed requests. Reflecting the caller
      # back would let any page read an authenticated answer.
      ALLOWED_ORIGINS: http://${PUBLIC_HOST:-localhost}:3777,http://localhost:3777,http://localhost:3778
      # On here only: the front image is built from ./front alone, so the
      # versioned schema.gql sits outside its build context and its codegen
      # falls back to introspecting over the private compose network. A public
      # deployment keeps this off (see back/render.yaml) — the Netlify build
      # reads the committed schema instead.
      GRAPHQL_INTROSPECTION: 'true'
    ports:
      - '3779:3779'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3779/graphql', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  front:
    build:
      context: ./front
      target: prod
    image: menu-front:prod
    restart: unless-stopped
    # `nuxt build` runs on first boot and is heap-hungry (it type-checks the
    # whole app and prerenders every route): Node otherwise sizes its heap to
    # the cgroup and OOMs the build. It idles far lower once serving.
    mem_limit: 4g
    depends_on:
      back:
        condition: service_healthy
    environment:
      PORT: 3777
      # Non-interactive pnpm: on a container recreate `pnpm build` re-checks deps
      # and, on a mismatch, would abort trying to purge node_modules with no TTY.
      CI: 'true'
      # Explicit build heap so `nuxt build` doesn't OOM under the mem_limit.
      NODE_OPTIONS: --max-old-space-size=3072
      GQL_HOST: http://back:3779/graphql
      GQL_CLIENT_HOST: http://${PUBLIC_HOST:-localhost}:3779/graphql
      NUXT_PUBLIC_API_BASE: http://${PUBLIC_HOST:-localhost}:3779
      NUXT_PUBLIC_I18N_BASE_URL: http://${PUBLIC_HOST:-localhost}:3777
    ports:
      - '3777:3777'
    # .output is NOT a volume: `nuxt build` rmdir's and recreates it, which fails
    # on a mount point (EBUSY). It lives in the container layer — persists across
    # restarts, rebuilt on recreate.
    volumes:
      # Kept apart from the dev one: this install runs under NODE_ENV=production,
      # which makes pnpm's pre-run check diverge on the dev side.
      - front-node-modules-prod:/app/node_modules
      # pnpm keeps its store on the same filesystem as the project and falls
      # back to <project>/.pnpm-store; giving that path a volume keeps it out of
      # the image layer and shares it with the dev stack, so a reinstall costs a
      # link instead of 1400 downloads.
      - pnpm-store:/app/.pnpm-store

volumes:
  postgres-data:
  front-node-modules-prod:
  pnpm-store:
