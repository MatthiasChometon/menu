# Netlify build for the front. Committed so a deploy is reproducible instead of
# depending on settings someone typed into a dashboard once.
#
# The repository is a monorepo: `base` moves Netlify into front/, but the whole
# tree is checked out, which is what lets the GraphQL codegen read the versioned
# schema at ../back/infrastructure/graphql/schema.gql.

[build]
  base = "front"
  command = "pnpm generate"
  publish = "front/.output/public"

[build.environment]
  NODE_VERSION = "24"
  # Corepack picks the pnpm version out of package.json.
  NPM_FLAGS = "--version"

# Where the browser reaches the API. Deliberately EMPTY until the API is really
# deployed: a guessed hostname is somebody else's domain until proven otherwise,
# and pointing a sign-in button at it would hand them the OAuth round trip.
#
# Once the service exists, fill both in — and add the same host to connect-src in
# public/_headers and to ALLOWED_ORIGINS on the API, or the browser drops every
# answer.
[context.production.environment]
  NUXT_PUBLIC_API_BASE = ""
  GQL_CLIENT_HOST = ""

[context.deploy-preview.environment]
  NUXT_PUBLIC_API_BASE = ""
  GQL_CLIENT_HOST = ""
