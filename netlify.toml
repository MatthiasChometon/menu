# Netlify build for the front. Committed so a deploy is reproducible instead of
# depending on settings someone typed into a dashboard once.
#
# The repository is a monorepo: `base` moves Netlify into front/, but the whole
# tree is checked out, which is what lets the GraphQL codegen read the versioned
# schema at ../back/infrastructure/graphql/schema.gql.

[build]
  base = "front"
  command = "pnpm generate"
  publish = "front/.output/public"

[build.environment]
  NODE_VERSION = "24"
  # Corepack picks the pnpm version out of package.json.
  NPM_FLAGS = "--version"

# Where the browser reaches the API — the real Render hostname, read off the
# dashboard rather than guessed. The same host has to appear in connect-src in
# public/_headers and in ALLOWED_ORIGINS on the API, or the browser drops every
# answer it gets.
[context.production.environment]
  NUXT_PUBLIC_API_BASE = "https://menu-api-chometon.onrender.com"
  GQL_CLIENT_HOST = "https://menu-api-chometon.onrender.com/graphql"

[context.deploy-preview.environment]
  NUXT_PUBLIC_API_BASE = "https://menu-api-chometon.onrender.com"
  GQL_CLIENT_HOST = "https://menu-api-chometon.onrender.com/graphql"
