# Netlify build for the front. Committed so a deploy is reproducible instead of
# depending on settings someone typed into a dashboard once.
#
# The repository is a monorepo: `base` moves Netlify into front/, but the whole
# tree is checked out, which is what lets the GraphQL codegen read the versioned
# schema at ../back/infrastructure/graphql/schema.gql.

[build]
  base = "front"
  command = "pnpm generate"
  publish = "front/.output/public"

# In [build.environment], NOT [context.production.environment], on purpose. The
# deploy is a CLI one (`netlify deploy --build --prod`) run from a worktree that
# sits on a feature branch, so Netlify resolves a non-production build context
# and skips the context block entirely — which baked localhost into apiBase, the
# GraphQL host and every canonical link in production. build.environment applies
# to every build whatever the branch, which is the only thing that is true here.
#
# Where the browser reaches the API — o2switch, under a free DuckDNS name.
# o2switch's own domain cannot hold a certificate (its CAA lookup fails), and a
# page served over https may not call an http host. The same host has to appear
# in connect-src in public/_headers and in ALLOWED_ORIGINS on the API, or the
# browser drops every answer it gets.
#
# Both GQL variables have to be set: clientHost alone leaves the server-side
# host on its development default, and that default is embedded in the payload
# every page ships. The site's own origin has to be named too, or every
# canonical and hreflang link in the deployed pages points at localhost.
[build.environment]
  NODE_VERSION = "24"
  # Corepack picks the pnpm version out of package.json.
  NPM_FLAGS = "--version"
  NUXT_PUBLIC_API_BASE = "https://api.menu.mtxlab.xyz"
  GQL_HOST = "https://api.menu.mtxlab.xyz/graphql"
  GQL_CLIENT_HOST = "https://api.menu.mtxlab.xyz/graphql"
  NUXT_PUBLIC_I18N_BASE_URL = "https://menu.mtxlab.xyz"
  # Photographs live on o2switch under a same-site subdomain (see
  # front/infrastructure/images/nuxt.config.ts). Kept in step with the API host.
  NUXT_PUBLIC_IMAGES_BASE = "https://images.menu.mtxlab.xyz"
